<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300">
  <rect width="260" height="300" fill="#fbf9f4"/>
  <text x="20" y="25" font-family="Arial" font-size="14" fill="#1b2a4a" font-weight="bold">Most reactive</text>
