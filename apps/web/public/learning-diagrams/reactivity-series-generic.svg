    <text x="40" y="170">Zinc (Zn)</text>
    <text x="40" y="193">Iron (Fe)</text>
    <text x="40" y="216">Lead (Pb)</text>
    <text x="40" y="239">Hydrogen (H)</text>
    <text x="40" y="262">Copper (Cu)</text>
