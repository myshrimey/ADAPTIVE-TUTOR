<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <rect width="400" height="180" fill="#fbf9f4"/>
  <g font-family="Arial" font-size="13" fill="#33456b" text-anchor="middle">
    <text x="90" y="20" fill="#1b2a4a" font-weight="bold">Asexual</text>
    <circle cx="90" cy="60" r="22" fill="#faf0dd" stroke="#c8811f" stroke-width="3"/>
