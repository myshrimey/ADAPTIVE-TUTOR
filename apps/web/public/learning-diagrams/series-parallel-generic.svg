<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180">
  <rect width="480" height="180" fill="#fbf9f4"/>
  <g font-family="Arial" font-size="14" fill="#33456b">
    <text x="20" y="20" fill="#1b2a4a" font-weight="bold">Series</text>
    <line x1="20" y1="90" x2="60" y2="90" stroke="#1b2a4a" stroke-width="3"/>
    <rect x="60" y="75" width="50" height="30" fill="#faf0dd" stroke="#c8811f" stroke-width="2"/>
    <text x="68" y="95" font-size="13">R1</text>
    <line x1="110" y1="90" x2="140" y2="90" stroke="#1b2a4a" stroke-width="3"/>
    <rect x="140" y="75" width="50" height="30" fill="#faf0dd" stroke="#c8811f" stroke-width="2"/>
    <text x="148" y="95" font-size="13">R2</text>
    <line x1="190" y1="90" x2="220" y2="90" stroke="#1b2a4a" stroke-width="3"/>
    <text x="20" y="140" font-size="13">Same current through both; equivalent R = R1 + R2</text>

    <text x="260" y="20" fill="#1b2a4a" font-weight="bold">Parallel</text>
    <line x1="260" y1="60" x2="460" y2="60" stroke="#1b2a4a" stroke-width="3"/>
    <line x1="260" y1="60" x2="260" y2="120" stroke="#1b2a4a" stroke-width="3"/>
    <line x1="460" y1="60" x2="460" y2="120" stroke="#1b2a4a" stroke-width="3"/>
    <line x1="260" y1="120" x2="460" y2="120" stroke="#1b2a4a" stroke-width="3"/>
    <rect x="320" y="52" width="50" height="20" fill="#faf0dd" stroke="#c8811f" stroke-width="2"/>
    <text x="330" y="67" font-size="12">R1</text>
    <rect x="320" y="110" width="50" height="20" fill="#faf0dd" stroke="#c8811f" stroke-width="2"/>
    <text x="330" y="125" font-size="12">R2</text>
    <text x="260" y="150" font-size="13">Same voltage across both;</text>
    <text x="260" y="166" font-size="13">1/R = 1/R1 + 1/R2</text>
  </g>
</svg>
